name: Test Build

# 测试构建: 用一次性 keystore 编译 debug APK 并上传为 artifact。
# 不打 tag、不发 release、不校验固定证书、不需要任何 secret。
# 每次构建的签名都不同, 安装前需先卸载旧版本。
on:
  workflow_dispatch:
  push:
    branches: [ test ]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create throwaway signing key
        run: |
          DIR="$RUNNER_TEMP/test-signing"
          mkdir -p "$DIR"
          keytool -genkeypair -keystore "$DIR/test.keystore" -alias test \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass testpass123 -keypass testpass123 -dname "CN=coloros-mod-test"
          printf 'storeFile=%s\nstorePassword=testpass123\nkeyAlias=test\nkeyPassword=testpass123\n' \
            "$DIR/test.keystore" > "$DIR/signing.properties"
          echo "ANDROID_SIGNING_PROPERTIES=$DIR/signing.properties" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coloros-mod-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
